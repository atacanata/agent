openapi: 3.0.3
info:
  title: Runner API
  version: 0.1.0
  description: Minimal API for PRJ-001 runner (Stage B).
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /projects:
    get:
      summary: List projects
      operationId: listProjects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "500":
          $ref: "#/components/responses/ServerError"
  /projects/{project_id}/runs:
    get:
      summary: List runs for a project
      operationId: listProjectRuns
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /projects/{project_id}/runs/{run_id}:
    get:
      summary: Get run details
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /projects/{project_id}/runs/{run_id}/artifacts:
    get:
      summary: List artifacts for a run
      operationId: listRunArtifacts
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Artifact list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artifact"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /projects/{project_id}/runs/{run_id}/artifacts/{name}:
    get:
      summary: Download artifact
      operationId: getRunArtifact
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ArtifactName"
      responses:
        "200":
          description: Artifact content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    ArtifactName:
      name: name
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
      required: [status]
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required: [id, name]
    Run:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        status:
          type: string
          enum: [queued, running, blocked, failed, succeeded]
        checkpoint:
          type: string
          enum: [A, B, C]
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, project_id, status, checkpoint]
    Artifact:
      type: object
      properties:
        name:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
      required: [name]
    Error:
      type: object
      properties:
        detail:
          type: string
      required: [detail]
